<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بقا در سرزمین وحشی - گرافیک جدید</title>
    <!-- استفاده از Tailwind CSS برای استایل‌دهی مدرن UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* استایل‌های اصلی و سفارشی */
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Tahoma', sans-serif; user-select: none; }
        
        /* رابط کاربری (HUD) */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 50; /* بالاتر از بازی */
        }

        .stat-bar {
            width: 200px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            margin-bottom: 5px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        .stat-fill {
            height: 100%;
            transition: width 0.5s;
        }
        .stat-text {
            position: absolute;
            top: 0; left: 0; width: 100%;
            text-align: center;
            font-size: 12px;
            color: white;
            line-height: 20px;
            text-shadow: 1px 1px 1px black;
        }

        #inventory {
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 12px;
            color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        #interaction-msg {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            display: none;
            font-weight: bold;
            border: 2px solid white;
            animation: pulse 1.5s infinite;
            z-index: 60;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* نام بازیکنان */
        .player-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            font-weight: bold;
        }

        /* صفحه ورود */
        #login-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="login-screen">
        <h1 class="text-5xl text-green-400 font-bold mb-2 drop-shadow-lg">بقا در سرزمین وحشی 🌲</h1>
        <p class="text-gray-400 mb-8 text-lg">نسخه گرافیکی</p>
        
        <div class="bg-white/10 p-8 rounded-2xl backdrop-blur-md border border-white/20 flex flex-col items-center">
            <input type="text" id="username-input" placeholder="نام قهرمان" class="p-3 rounded-lg text-black mb-4 w-64 text-center font-bold focus:outline-none focus:ring-2 focus:ring-green-500" maxlength="10">
            <button onclick="startGame()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105 shadow-lg">ورود به جهان</button>
        </div>
        
        <div class="mt-8 flex gap-4 text-gray-400 text-sm">
            <div class="flex flex-col items-center"><span class="border border-gray-500 p-1 rounded w-8 h-8 flex items-center justify-center mb-1">W</span>حرکت</div>
            <div class="flex flex-col items-center"><span class="border border-gray-500 p-1 rounded w-8 h-8 flex items-center justify-center mb-1">E</span>تعامل</div>
        </div>
    </div>

    <!-- پیام تعامل -->
    <div id="interaction-msg">کلید E را بزنید</div>

    <!-- لایه UI -->
    <div id="ui-layer" style="display:none;">
        <!-- بالا چپ: وضعیت -->
        <div>
            <div class="stat-bar">
                <div id="hp-bar" class="stat-fill bg-gradient-to-r from-red-800 to-red-500" style="width: 100%;"></div>
                <div class="stat-text">❤️ سلامتی</div>
            </div>
            <div class="stat-bar">
                <div id="hunger-bar" class="stat-fill bg-gradient-to-r from-orange-700 to-orange-400" style="width: 100%;"></div>
                <div class="stat-text">🍖 گرسنگی</div>
            </div>
        </div>

        <!-- پایین راست: اینونتوری ساده -->
        <div class="flex justify-end items-end">
            <div id="inventory">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-lg">
                        <span class="text-2xl filter drop-shadow">🪵</span>
                    </div>
                    <div>
                        <span id="wood-count" class="text-2xl font-bold">0</span>
                        <div class="text-xs text-gray-300">چوب بلوط</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- کانتینر سه بعدی -->
    <div id="game-container"></div>
    <!-- کانتینر لیبل‌ها (برای نام بازیکنان) -->
    <div id="labels-container"></div>

    <!-- Three.js (نسخه جدید) و Firebase SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script type="module">
        // وارد کردن ماژول‌های فایربیس
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- تنظیمات فایربیس و متغیرهای سراسری Canvas ---
        // متغیرهای اجباری که در محیط Canvas تزریق می‌شوند.
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- Firebase Init ---
        let app;
        let auth;
        let db;
        
        // --- متغیرهای جهانی بازی ---
        let scene, camera, renderer;
        // ساختار بازیکن: group (شامل کل کاراکتر), limbs (اجزای متحرک)، stats
        let localPlayer = { group: null, id: null, name: 'Player', stats: { hp: 100, hunger: 100, wood: 0 }, limbs: {} };
        let remotePlayers = {}; // { id: { group, targetPos, targetRot, labelEl, limbs, isMoving } }
        let resources = []; // آرایه‌ای برای نگهداری مش‌های منابع (درختان)
        let keys = { w: false, a: false, s: false, d: false }; // وضعیت کلیدها
        let gameActive = false;
        let nearbyResource = null; // منبع نزدیک برای تعامل
        let lastTimestamp = 0;
        
        // --- تنظیمات بازی ---
        const SPEED = 5.0; // سرعت حرکت در واحد بر ثانیه
        const WORLD_SIZE = 200; // اندازه نقشه
        const TREE_COUNT = 60; // تعداد درختان

        // --- راه‌اندازی اولیه ---
        window.startGame = async () => {
            const nameInput = document.getElementById('username-input');
            if(!nameInput.value.trim()) {
                // استفاده از alert ممنوع است، اما برای UX ساده در اینجا می‌ماند.
                // در محیط واقعی باید از یک مودال استفاده شود.
                alert("لطفا یک نام انتخاب کنید!"); 
                return;
            }
            localPlayer.name = nameInput.value.trim();
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            
            // احراز هویت و شروع بازی
            await initAuth();
            initGame();
        };

        async function initAuth() {
            if (Object.keys(firebaseConfig).length === 0) {
                 console.error("Firebase config is missing.");
                 return;
            }
            
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // تلاش برای احراز هویت با توکن سفارشی یا ناشناس
            if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                } catch (e) {
                    console.error("Authentication with custom token failed, signing in anonymously:", e);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }
            
            localPlayer.id = auth.currentUser.uid;
            startNetworking();
        }

        function initGame() {
            gameActive = true;

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 10);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 4. Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(50, 80, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            scene.add(dirLight);

            // 5. Ground
            const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x5D9C59, roughness: 0.8 }); 
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Local Player Character (Mesh)
            localPlayer.group = createCharacterMesh(0x2196F3, localPlayer.limbs); 
            scene.add(localPlayer.group);

            // 7. Resources (Trees)
            generateResources();

            // 8. Event Listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('resize', onWindowResize);

            // 9. Start Game Loop
            lastTimestamp = performance.now();
            animate();
            
            // Health/Hunger drain loop
            setInterval(() => {
                if(!gameActive) return;
                localPlayer.stats.hunger = Math.max(0, localPlayer.stats.hunger - 1);
                
                if(localPlayer.stats.hunger === 0) {
                    localPlayer.stats.hp = Math.max(0, localPlayer.stats.hp - 2);
                }
                
                updateUI();
            }, 2000);
        }
        
        function handleKeyDown(e) {
            // Use e.code for consistent key detection across keyboard layouts (including Farsi)
            const key = e.code.replace('Key', '').toLowerCase(); 
            if(keys.hasOwnProperty(key)) keys[key] = true;
            
            if(e.code === 'KeyE') interact();
            
            // Prevent default browser actions for game keys
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE'].includes(e.code)) {
                e.preventDefault();
            }
        }
        
        function handleKeyUp(e) {
            const key = e.code.replace('Key', '').toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
        }


        // --- ساخت مدل کاراکتر Humanoid (به سبک وکسل/ماینکرفت) ---
        function createCharacterMesh(color, limbsObj) {
            const group = new THREE.Group();
            group.position.y = 0; 

            // Materials
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, metalness: 0.1 }); 
            const shirtMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.2 }); 
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.1 }); 

            // 1. Body
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 0.3);
            const body = new THREE.Mesh(bodyGeo, shirtMat);
            body.position.y = 0.85; 
            body.castShadow = true;
            group.add(body);

            // 2. Head
            const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.45;
            head.castShadow = true;
            group.add(head);

            // 3. Arms (using groups for rotation pivot)
            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.45, 1.15, 0); 
            const leftArm = new THREE.Mesh(armGeo, shirtMat);
            leftArm.position.y = -0.35; 
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            group.add(leftArmGroup);
            limbsObj.leftArm = leftArmGroup;

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.45, 1.15, 0); 
            const rightArm = new THREE.Mesh(armGeo, shirtMat);
            rightArm.position.y = -0.35;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            group.add(rightArmGroup);
            limbsObj.rightArm = rightArmGroup;

            // 4. Legs (using groups for rotation pivot)
            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);

            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.15, 0.5, 0); 
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.y = -0.35; 
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            group.add(leftLegGroup);
            limbsObj.leftLeg = leftLegGroup;

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.15, 0.5, 0); 
            const rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.y = -0.35;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            group.add(rightLegGroup);
            limbsObj.rightLeg = rightLegGroup;

            return group;
        }

        // --- ساخت درختان ---
        function generateResources() {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.7 });
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2E7D32, metalness: 0.1 });

            for(let i=0; i<TREE_COUNT; i++) {
                // Random position within the world bounds
                const x = (Math.sin(i * 123.45) * (WORLD_SIZE/2 - 5)) * (0.5 + Math.random() * 0.5);
                const z = (Math.cos(i * 678.90) * (WORLD_SIZE/2 - 5)) * (0.5 + Math.random() * 0.5);
                
                const scale = 0.8 + Math.random() * 0.5;

                // Trunk
                const trunkGeo = new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, 1.5 * scale, 7);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.set(x, (0.75 * scale), z);
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                
                // Leaves (layered cones)
                const l1 = new THREE.Mesh(new THREE.ConeGeometry(1.2 * scale, 1.5 * scale, 8), leavesMat);
                l1.position.y = 0.8 * scale;
                l1.castShadow = true;
                trunk.add(l1);

                const l2 = new THREE.Mesh(new THREE.ConeGeometry(0.9 * scale, 1.2 * scale, 8), leavesMat);
                l2.position.y = 1.5 * scale;
                l2.castShadow = true;
                trunk.add(l2);

                scene.add(trunk);
                resources.push({ mesh: trunk, type: 'tree', x, z, health: 10 }); 
            }
        }

        // --- Networking (Firestore) ---
        function startNetworking() {
            if(!db || !localPlayer.id) return;
            const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');

            // 1. Listen for remote players
            onSnapshot(playersRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const data = change.doc.data();
                    const pid = change.doc.id;

                    if (pid === localPlayer.id) return; 

                    if (change.type === "added") {
                        addRemotePlayer(pid, data);
                    }
                    if (change.type === "modified") {
                        updateRemotePlayer(pid, data);
                    }
                    if (change.type === "removed") {
                        removeRemotePlayer(pid);
                    }
                });
            });

            // 2. Send local player updates
            setInterval(() => {
                if(!localPlayer.group || !db) return;
                const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', localPlayer.id);
                setDoc(myRef, {
                    x: localPlayer.group.position.x,
                    z: localPlayer.group.position.z,
                    rot: localPlayer.group.rotation.y,
                    name: localPlayer.name,
                    lastSeen: serverTimestamp() 
                }, { merge: true }).catch(e => console.error("Error updating player pos:", e));
            }, 100); 
            
            // 3. Cleanup on disconnect
            window.addEventListener('beforeunload', () => {
                if (localPlayer.id) {
                    const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', localPlayer.id);
                    deleteDoc(myRef);
                }
            });
        }

        function addRemotePlayer(id, data) {
            const limbs = {};
            // Generate a color based on the ID for consistency (simple hash)
            const colorHash = id.split('').reduce((acc, char) => char.charCodeAt(0) + ((acc << 5) - acc), 0);
            const color = '#' + (0x1000000 + (colorHash & 0xffffff)).toString(16).slice(1);

            const group = createCharacterMesh(color, limbs); 
            group.position.set(data.x, 0, data.z);
            scene.add(group);

            const label = document.createElement('div');
            label.className = 'player-label';
            label.innerText = data.name || 'بازیکن';
            document.getElementById('labels-container').appendChild(label);

            remotePlayers[id] = { 
                group, 
                targetPos: new THREE.Vector3(data.x, 0, data.z), 
                targetRot: data.rot || 0,
                labelEl: label,
                limbs,
                isMoving: false,
                lastPos: new THREE.Vector3(data.x, 0, data.z)
            };
        }

        function updateRemotePlayer(id, data) {
            if(remotePlayers[id]) {
                const p = remotePlayers[id];
                
                // Set the target position and rotation for interpolation
                p.targetPos.set(data.x, 0, data.z);
                p.targetRot = data.rot;
            }
        }

        function removeRemotePlayer(id) {
            if(remotePlayers[id]) {
                scene.remove(remotePlayers[id].group);
                remotePlayers[id].labelEl.remove();
                delete remotePlayers[id];
            }
        }

        // --- Interaction Logic (Key E) ---
        function interact() {
            if(!gameActive) return;
            
            // Interaction Lock to prevent spamming E during animation
            if (localPlayer.limbs.rightArm.isSwinging) return;
            
            if(nearbyResource && nearbyResource.type === 'tree') {
                
                // Arm swing animation
                const arm = localPlayer.limbs.rightArm;
                arm.isSwinging = true;
                let swing = 0;
                const swingDuration = 10;
                
                const interval = setInterval(() => {
                    swing += 0.5;
                    // Rotate the arm back and forth
                    arm.rotation.x = -Math.sin(swing) * 2; 

                    if(swing > Math.PI) {
                        clearInterval(interval);
                        arm.rotation.x = 0; // Reset arm
                        arm.isSwinging = false;
                        
                        // Game logic after animation completes
                        nearbyResource.health -= 1;
                        localPlayer.stats.hunger = Math.max(0, localPlayer.stats.hunger - 1); 
                        
                        // Tree visual feedback (shake)
                        const tree = nearbyResource.mesh;
                        tree.rotation.z = 0.1;
                        setTimeout(() => tree.rotation.z = -0.1, 50);
                        setTimeout(() => tree.rotation.z = 0, 100);

                        if(nearbyResource.health <= 0) {
                            // Tree destroyed
                            scene.remove(nearbyResource.mesh);
                            resources = resources.filter(res => res !== nearbyResource);
                            nearbyResource = null;
                            localPlayer.stats.wood += 5; // Extra reward
                            
                        } else {
                             localPlayer.stats.wood += 1;
                        }
                        
                        updateUI();
                    }
                }, swingDuration);
            }
        }

        function updateUI() {
            document.getElementById('wood-count').innerText = localPlayer.stats.wood;
            document.getElementById('hp-bar').style.width = localPlayer.stats.hp + '%';
            document.getElementById('hunger-bar').style.width = localPlayer.stats.hunger + '%';
            
            checkInteractions(); // Update interaction message
            
            // Game Over Check
            if (localPlayer.stats.hp <= 0 && gameActive) {
                gameActive = false;
                const msgEl = document.getElementById('interaction-msg');
                msgEl.style.display = 'block';
                msgEl.innerText = "شما از گرسنگی مردید. صفحه را رفرش کنید.";
                msgEl.style.borderColor = '#991b1b';
            }
        }

        function checkInteractions() {
            if (!localPlayer.group) return;
            let found = null;
            const myPos = localPlayer.group.position;
            const interactionRange = 3.0; // Range to interact with trees
            
            for(let res of resources) {
                const dist = myPos.distanceTo(res.mesh.position);
                if(dist < interactionRange) {
                    found = res;
                    break;
                }
            }

            nearbyResource = found;
            const msgEl = document.getElementById('interaction-msg');
            if(found) {
                msgEl.style.display = 'block';
                msgEl.innerText = `[E] قطع درخت (جان: ${found.health})`;
            } else {
                msgEl.style.display = 'none';
            }
        }

        // --- Animation Loop ---
        function updateAnimation(limbs, isMoving, time) {
            // Prevent animation if the arm is swinging (interact() logic handles that)
            if (limbs.rightArm.isSwinging) return; 

            if (isMoving) {
                const speed = 10;
                const angle = Math.sin(time * speed) * 0.8; 
                
                // Opposite swings for arms and legs
                limbs.leftArm.rotation.x = angle;
                limbs.rightArm.rotation.x = -angle;
                limbs.leftLeg.rotation.x = -angle;
                limbs.rightLeg.rotation.x = angle;
            } else {
                // Idle position
                limbs.leftArm.rotation.x = 0;
                limbs.rightArm.rotation.x = 0;
                limbs.leftLeg.rotation.x = 0;
                limbs.rightLeg.rotation.x = 0;
            }
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            
            if(!gameActive || !localPlayer.group) return;

            const deltaTime = (timestamp - lastTimestamp) / 1000; 
            lastTimestamp = timestamp;
            
            const time = timestamp * 0.001; 

            // 1. Local Player Movement
            const dir = new THREE.Vector3();
            let isMoving = false;

            if(keys.w) dir.z -= 1;
            if(keys.s) dir.z += 1;
            if(keys.a) dir.x -= 1;
            if(keys.d) dir.x += 1;

            if(dir.length() > 0) {
                isMoving = true;
                // Apply movement based on direction, speed, and delta time
                dir.normalize().multiplyScalar(SPEED * deltaTime); 
                localPlayer.group.position.add(dir);
                
                // Smooth rotation towards the movement direction
                const targetAngle = Math.atan2(dir.x, dir.z);
                const currentRot = localPlayer.group.rotation.y;
                let diff = targetAngle - currentRot;
                // Find the shortest rotation path
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                localPlayer.group.rotation.y += diff * 0.2; // Lerp factor
            }

            // Update local player animation
            updateAnimation(localPlayer.limbs, isMoving, time);

            // World boundaries check
            localPlayer.group.position.x = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, localPlayer.group.position.x));
            localPlayer.group.position.z = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, localPlayer.group.position.z));

            // 2. Camera Update (Smooth follow)
            const idealOffset = new THREE.Vector3(0, 8, 10);
            const targetCamPos = localPlayer.group.position.clone().add(idealOffset);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(localPlayer.group.position);

            // 3. Remote Players Update (Interpolation and Animation)
            for(let id in remotePlayers) {
                const p = remotePlayers[id];
                
                // Detect movement for remote animation
                const distanceMoved = p.group.position.distanceTo(p.lastPos);
                // Use a velocity check (instead of distance moved per frame)
                p.isMoving = p.group.position.distanceTo(p.targetPos) > 0.05; 
                p.lastPos.copy(p.group.position);
                
                // Interpolate position and rotation
                p.group.position.lerp(p.targetPos, 0.2);
                let diff = p.targetRot - p.group.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                p.group.rotation.y += diff * 0.2;

                // Remote animation
                updateAnimation(p.limbs, p.isMoving, time);
                
                // Update label position
                updateLabelPosition(p.group, p.labelEl);
            }

            renderer.render(scene, camera);
        }

        // --- Utility Functions ---
        
        // Function to position the 2D label above the 3D player mesh
        function updateLabelPosition(group, label) {
            const vector = group.position.clone();
            vector.y += 2.2; // Height offset above the head
            vector.project(camera);

            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;

            // Check if player is behind the camera
            if(vector.z > 1) { 
                label.style.display = 'none';
            } else {
                label.style.display = 'block';
                label.style.left = x + 'px';
                label.style.top = y + 'px';
            }
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
    </script>
